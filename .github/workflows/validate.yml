name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    name: structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate data/, skills/, packages/
        run: python3 .github/scripts/validate.py

      - name: Smoke-test the example skill
        run: |
          node skills/csv-to-excel/run.ts skills/csv-to-excel/samples/sales.csv /tmp/smoke.xlsx
          python3 - <<'PY'
          import zipfile
          parts = set(zipfile.ZipFile("/tmp/smoke.xlsx").namelist())
          assert "xl/worksheets/sheet1.xml" in parts, parts
          assert "xl/worksheets/sheet2.xml" in parts, parts
          print("workbook parts ok:", len(parts))
          PY
